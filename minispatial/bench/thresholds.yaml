# ============================================================================

meta:
  # PARTIAL approval. The reproduction gate below is SET and APPROVED. The parity
  # and stability thresholds are still null: they judge quantized measurements,
  # none of which exist yet, and rule 2 requires them to be set before the first
  # one is taken -- not now, and not after.
  status: reproduction_approved__parity_and_stability_pending
  reproduction_set_by: Ameya Kiwalkar
  reproduction_set_on: 2026-09-08
  parity_set_by: null
  parity_set_on: null
  # Must be a commit that precedes every quantized measurement in results/.
  committed_before_first_quantized_measurement: true

# --------------------------------------------------------------------------
# Reproduction gate (M0). How close our 300M teacher evaluation must land to
# the published Prithvi-EO-2.0 Sen1Floods11 figure to count as "reproduced".
# --------------------------------------------------------------------------
reproduction:
  miou_abs_pp: 1.0
  iou_water_abs_pp: 1.0
  justification: |
    SET AND APPROVED by Ameya on 2026-09-08, BEFORE any evaluation was run.
    +/- 1.0 percentage points absolute on both mIoU and IoU_water.

    Anchored to the only quantitative statement available about run-to-run
    variation in this pipeline: the Prithvi-EO-2.0 repository author's note of
    roughly 1% Lightning non-determinism (context/FACTS.md, tagged `unverified`
    -- the original statement was not located, which is itself a reason not to
    treat this bound as precise).

    What this bound is actually absorbing. We are not retraining; we are
    evaluating a fixed published checkpoint, where run-to-run noise should be
    far smaller than training non-determinism. So 1.0 pp is not a noise budget,
    it is a budget for SYSTEMATIC difference, and three sources are already
    known: (a) terratorch 1.2.13 rejects the official config's
    `decoder_scale_modules`, and whether that changes the decoder is unknown
    (DECISIONS D011); (b) the resampling kernel is albumentations' default,
    pinned but not verified against what the publisher used; (c) the published
    figure's mIoU definition is not yet known.

    Consequence of a miss. Exceeding this bound is a signal to investigate one
    of those three, NOT an automatic kill. ROADMAP section 11's kill condition
    is the teacher failing to load or evaluate at all, not missing tolerance.
    Whatever happens, the measured number is recorded and reported as measured
    (rule 10) -- the tolerance decides what we call it, not what we publish.

    Definition dependency. Our mIoU is the macro mean of per-class IoU over
    classes present, verified equal to
    torchmetrics.MulticlassJaccardIndex(average="macro"). On a 2-class problem
    with this class imbalance, macro mIoU, IoU_water alone and micro-averaged
    IoU differ by more than 1.0 pp. THE PUBLISHED FIGURE'S DEFINITION MUST BE
    RECORDED ALONGSIDE ITS VALUE before this tolerance is applied; a bound
    applied across two different definitions is not a gate.

# --------------------------------------------------------------------------
# Parity: agreement between a deployed artifact and its fp32 PyTorch reference.
# Exceeding any of these sets parity_fail=1. See context/SCHEMA.md.
# --------------------------------------------------------------------------
parity:
  fp16:
    pixel_disagreement_pct: null
    max_abs_logit_diff: null
    delta_miou_pp: null
    justification: |
      NOT SET. fp16 is a precision change with no quantization; a large
      disagreement here means the export is wrong, not that compression cost
      something. ROADMAP section 11 makes this a KILL condition: if no tiny
      artifact meets the fp16 parity threshold after 8 hours, the project stops
      and reports. That makes this the single most consequential number in the
      file and it must be set deliberately, before any artifact is measured.
  int8:
    pixel_disagreement_pct: null
    max_abs_logit_diff: null
    delta_miou_pp: null
    justification: |
      NOT SET. Unlike fp16, some disagreement here is the phenomenon under
      study rather than a defect. The threshold marks where an artifact stops
      being a faithful deployment of the model and becomes a different model.
  int4:
    pixel_disagreement_pct: null
    max_abs_logit_diff: null
    delta_miou_pp: null
    justification: |
      NOT SET. Expected to be the loosest tier. A row that exceeds it is still
      kept and reported -- "int4 breaks this model" is a result, and per
      ROADMAP section 11 reconstruction PTQ failing to beat vendor PTQ is a
      null result, not a kill.

# --------------------------------------------------------------------------
# Run-to-run stability. Exceeding this sets unstable=1: the row is kept and
# excluded from the frontier line, never deleted or re-run until it passes.
# --------------------------------------------------------------------------
stability:
  run_spread_pct: null
  justification: |
    NOT SET. Computed across 3 fresh-process runs as
    (max - min) / median * 100 of per-run median latency. ROADMAP section 11
    makes this a conditional kill: if spread cannot be brought under threshold
    after controlling power and thermal state, cut to the stable subset, and
    kill if fewer than two runtimes remain. Setting it requires knowing this
    machine's baseline variance, which is not yet measured -- an argument for
    measuring an fp16 cell's spread first and setting the threshold from the
    *reference* row before any quantized cell is measured.
  min_runs: 3
  power_state_required: null   # e.g. "ac" -- decide before measuring, not after
